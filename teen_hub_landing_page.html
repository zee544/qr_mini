<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090d16">
    <title>Quick Links | Teen Hub</title>

    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ========== Reset & Variables ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-dark: #070a12;
            --glass-card: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.22);
            --text-main: #ffffff;
            --text-muted: #e2e8f0;
        }

        html, body {
            height: 100%;
            overscroll-behavior: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: max(16px, env(safe-area-inset-top))
                     max(16px, env(safe-area-inset-right))
                     max(16px, env(safe-area-inset-bottom))
                     max(16px, env(safe-area-inset-left));
            color: var(--text-main);
            position: relative;
            overflow-x: hidden;
        }

        /* ========== Fullscreen Background Video ========== */
        #bgVideo {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 0;
            transform: translate(-50%, -50%);
            object-fit: cover;
            pointer-events: none;
            filter: brightness(0.8) contrast(1.05);
        }

        /* Dark tint overlay for readable text */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
            pointer-events: none;
        }

        /* ========== Audio Toggle ========== */
        .audio-toggle {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .audio-toggle:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.28);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
        }

        /* ========== Transparent Glass Container ========== */
        .hub-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--glass-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            padding: 38px 24px calc(28px + env(safe-area-inset-bottom));
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            overflow: hidden;

            opacity: 0;
            transform: translateY(24px);
            animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes rise {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== Avatar Header ========== */
        .avatar-container {
            position: relative;
            width: 88px;
            height: 88px;
            margin: 0 auto 18px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #06b6d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: #fff;
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.5);
            transition: transform 0.3s ease;
        }

        .status-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #10b981;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 12px #10b981;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px #10b981; transform: scale(1); }
            50%      { box-shadow: 0 0 20px #10b981; transform: scale(1.15); }
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(26px, 6vw, 30px);
            font-weight: 800;
            letter-spacing: -0.6px;
            margin-bottom: 6px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: clamp(13px, 3.6vw, 14px);
            margin-bottom: 28px;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
        }

        /* ========== Professional Color Glass Buttons ========== */
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .card-btn {
            position: relative;
            display: flex;
            align-items: center;
            padding: 20px;
            border-radius: 22px;
            text-decoration: none;
            color: #fff;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        border-color 0.25s ease,
                        background 0.3s ease,
                        box-shadow 0.25s ease;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            touch-action: manipulation;

            opacity: 0;
            transform: translateX(-20px);
            animation: slideIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .card-btn:nth-child(1) { animation-delay: 0.15s; }
        .card-btn:nth-child(2) { animation-delay: 0.28s; }
        .card-btn:nth-child(3) { animation-delay: 0.41s; }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }

        /* Button 1: Socials (Magenta / Sunset Tint) */
        .card-social {
            background: linear-gradient(135deg, rgba(175, 4, 89, 0.619), rgba(168, 85, 247, 0.22));
            border-color: rgba(90, 5, 47, 0.574);
        }
        .card-social .icon-box { background: rgba(236, 72, 153, 0.35); }
        .card-social .card-tag { background: rgba(236, 72, 153, 0.4); }

        /* Button 2: Gaming (Indigo / Blue Tint) */
        .card-gaming {
            background: linear-gradient(135deg, rgba(2, 4, 99, 0.575), rgba(59, 130, 246, 0.22));
            border-color: rgba(7, 8, 100, 0.415);
        }
        .card-gaming .icon-box { background: rgba(99, 102, 241, 0.35); }
        .card-gaming .card-tag { background: rgba(99, 102, 241, 0.4); }

        /* Button 3: Tech & Study (Teal / Emerald Tint) */
        .card-tech {
            background: linear-gradient(135deg, rgba(4, 115, 106, 0.523), rgba(6, 182, 212, 0.22));
            border-color: rgba(7, 98, 114, 0.341);
        }
        .card-tech .icon-box { background: rgba(13, 148, 136, 0.35); }
        .card-tech .card-tag { background: rgba(13, 148, 136, 0.4); }

        /* Professional Hover Effects */
        @media (hover: hover) {
            .card-btn:hover {
                transform: translateY(-4px) scale(1.02);
            }
            .card-social:hover {
                background: linear-gradient(135deg, rgba(236, 72, 153, 0.48), rgba(168, 85, 247, 0.35));
                box-shadow: 0 12px 30px rgba(236, 72, 153, 0.35);
                border-color: rgba(236, 72, 153, 0.7);
            }
            .card-gaming:hover {
                background: linear-gradient(135deg, rgba(99, 102, 241, 0.48), rgba(59, 130, 246, 0.35));
                box-shadow: 0 12px 30px rgba(99, 102, 241, 0.35);
                border-color: rgba(99, 102, 241, 0.7);
            }
            .card-tech:hover {
                background: linear-gradient(135deg, rgba(13, 148, 136, 0.48), rgba(6, 182, 212, 0.35));
                box-shadow: 0 12px 30px rgba(6, 182, 212, 0.35);
                border-color: rgba(6, 182, 212, 0.7);
            }

            .card-btn:hover .arrow-box {
                background: #ffffff;
                color: #0f172a;
                transform: translate(3px, -3px);
            }
        }

        .card-btn:active { transform: translateY(-1px) scale(0.98); }

        .icon-box {
            width: 54px;
            height: 54px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 16px;
            flex-shrink: 0;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3);
        }

        .card-content {
            text-align: left;
            flex-grow: 1;
            min-width: 0;
        }

        .card-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.9px;
            padding: 3px 9px;
            border-radius: 20px;
            margin-bottom: 5px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        .card-content h3 {
            font-size: clamp(16px, 4vw, 18px);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 3px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        .card-content span {
            font-size: clamp(11px, 3vw, 12px);
            color: var(--text-muted);
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .arrow-box {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #fff;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        footer {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <!-- Video Background Layer -->
    <video id="bgVideo" autoplay loop muted playsinline>
        <source src="beach.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    

    <!-- Main Transparent Glass Container -->
    <main class="hub-container">

      
        <h1>Alex's Hub</h1>
        <p class="subtitle">Select an option to connect &amp; explore</p>

        <div class="cards-list">

            <!-- Card 1 -->
            <a href="https://www.instagram.com" class="card-btn card-social" aria-label="Open Socials and TikTok">
                <div class="icon-box" aria-hidden="true">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <div class="card-content">
                    <div class="card-tag">Trending</div>
                    <h3>Socials &amp; TikTok</h3>
                    <span>Check out latest posts &amp; feeds</span>
                </div>
                <div class="arrow-box" aria-hidden="true">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

            <!-- Card 2 -->
            <a href="https://www.discord.com" class="card-btn card-gaming" aria-label="Open Gaming and Discord">
                <div class="icon-box" aria-hidden="true">
                    <i class="fa-brands fa-discord"></i>
                </div>
                <div class="card-content">
                    <div class="card-tag">Online</div>
                    <h3>Gaming &amp; Discord</h3>
                    <span>Join squad &amp; chat online</span>
                </div>
                <div class="arrow-box" aria-hidden="true">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

            <!-- Card 3 -->
            <a href="https://www.youtube.com" class="card-btn card-tech" aria-label="Open Study and Tech AI">
                <div class="icon-box" aria-hidden="true">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div class="card-content">
                    <div class="card-tag">Featured</div>
                    <h3>Study &amp; Tech AI</h3>
                    <span>Guides, tools &amp; tutorials</span>
                </div>
                <div class="arrow-box" aria-hidden="true">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

        </div>

        <footer>
            <p>© Quick Landing Hub</p>
        </footer>

    </main>

    <script>
        /* Audio Engine */
        let soundEnabled = true;
        let audioCtx = null;

        function getAudioCtx() {
            if (!audioCtx) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (Ctx) audioCtx = new Ctx();
            }
            return audioCtx;
        }

        function playSynthClick() {
            if (!soundEnabled) return;
            const ctx = getAudioCtx();
            if (!ctx) return;
            if (ctx.state === 'suspended') ctx.resume();

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 0.08);
        }

        function hapticPulse() {
            if (navigator.vibrate) navigator.vibrate(8);
        }

        const audioToggle = document.getElementById('audioToggle');
        const audioIcon = document.getElementById('audioIcon');

        audioToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            audioToggle.setAttribute('aria-pressed', String(soundEnabled));

            if (soundEnabled) {
                audioIcon.className = 'fa-solid fa-volume-high';
                playSynthClick();
            } else {
                audioIcon.className = 'fa-solid fa-volume-xmark';
            }
        });

        /* Button Interactions & Sound Feedback */
        document.querySelectorAll('.card-btn').forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                btn.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
                btn.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
            });

            btn.addEventListener('touchstart', () => {
                playSynthClick();
                hapticPulse();
            }, { passive: true });

            btn.addEventListener('mouseenter', playSynthClick);
        });
    </script>
</body>
</html>
